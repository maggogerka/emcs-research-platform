name: CI

on:
  push:
  pull_request:

jobs:
  python-and-windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m unittest analysis.test_protocol -v
      - run: python -m PyInstaller --clean --noconfirm emcs.spec
      - uses: actions/upload-artifact@v4
        with:
          name: EMCSResearchPlatform-windows
          path: dist/EMCSResearchPlatform.exe

  esp-idf-firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.0
    steps:
      - uses: actions/checkout@v4
      - run: idf.py set-target esp32s3
      - run: idf.py build
